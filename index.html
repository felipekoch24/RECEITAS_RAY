<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADERNO DE RECEITAS DA RAYSSA 🌸</title>

    <!-- PWA / Ícones -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fbcfe8">
    <link rel="icon" type="image/png" href="icon.png">
    
    <!-- Estilos CSS: Modo Visão Máxima para a Chef -->
    <style>
        :root {
            --bg-mesa: #fde2e4; 
            --capa-livro: #db2777; 
            --borda-livro: #9d174d;
            --papel-linha: #fbcfe8; 
            --papel-fundo: #ffffff; 
            --texto-principal: #4a1535;
            --rosa-botao: #ec4899;
            --sombra-livro: 0 30px 60px rgba(157, 23, 77, 0.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: var(--bg-mesa);
            color: var(--texto-principal); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 5px; 
            overflow-x: hidden; 
        }

        /* Estrutura do Livro / Caderno */
        .livro-container {
            width: 100%;
            max-width: 1450px;
            height: 90vh;
            background: var(--capa-livro);
            border-radius: 20px;
            box-shadow: var(--sombra-livro);
            display: flex;
            flex-direction: column;
            position: relative;
            border: 8px solid var(--borda-livro);
            border-top: 18px solid #831843;
        }

        /* Páginas Duplas Abertas */
        .livro-paginas {
            flex: 1;
            background: var(--papel-fundo);
            margin: 12px 12px 0 12px;
            border-radius: 14px 14px 0 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            padding: 40px 50px;
            box-shadow: inset 0 0 25px rgba(219, 39, 119, 0.06);
            position: relative;
            overflow-y: auto;
        }

        /* Divisória central das páginas */
        .livro-paginas::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 12px;
            background: linear-gradient(to right, rgba(0,0,0,0.05), rgba(219,39,119,0.15), rgba(0,0,0,0.05));
            transform: translateX(-50%);
            pointer-events: none;
        }

        .pagina-secao {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .pagina-secao.active {
            display: flex;
        }

        /* CABEÇALHOS GIGANTES */
        h2 {
            font-size: 32px;
            color: #be185d;
            margin-bottom: 20px;
            border-bottom: 4px dashed #f472b6;
            padding-bottom: 12px;
            font-weight: 900;
        }

        label {
            font-size: 20px;
            color: #be185d;
            margin-bottom: 10px;
            display: block;
            font-weight: bold;
        }

        input {
            background: #fff;
            border: 3px solid #f472b6;
            color: #222;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 22px;
            margin-bottom: 18px;
            width: 100%;
            outline: none;
            font-weight: bold;
        }
        input:focus { border-color: var(--rosa-botao); box-shadow: 0 0 12px rgba(236,72,153,0.5); }

        /* --- LINHAS DE CADERNO COM LETRA BEM GRANDE --- */
        .caderno-linhas {
            background-color: #fff;
            background-image: linear-gradient(var(--papel-linha) 1px, transparent 1px);
            background-size: 100% 45px;
            line-height: 45px;         
            border: 3px solid #f472b6;
            color: #111;
            padding: 6px 18px;
            border-radius: 12px;
            font-size: 22px;
            resize: none;
            width: 100%;
            outline: none;
            flex: 1;
        }
        .caderno-linhas:focus { border-color: var(--rosa-botao); }

        button {
            background: var(--rosa-botao);
            color: #fff;
            border: none;
            padding: 18px 28px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(236,72,153,0.45);
            transition: all 0.2s;
        }
        button:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Cards de Receitas Salvas GIGANTES */
        .receita-card {
            background: #fff;
            border: 3px solid #fbcfe8;
            border-left: 12px solid var(--rosa-botao);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 22px;
            font-size: 20px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.06);
        }

        /* Cards da Wishlist */
        .wish-card {
            background: #fff;
            border: 3px solid #fbcfe8;
            border-left: 12px solid #db2777;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 16px;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .wish-comprado {
            opacity: 0.65;
            background: #fdf2f8;
        }
        .wish-comprado .wish-nome {
            text-decoration: line-through;
            color: #888;
        }

        /* ABAS NA PARTE INFERIOR GIGANTES */
        .livro-abas-inferior {
            height: 85px;
            background: var(--capa-livro);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 0 25px;
            border-radius: 0 0 20px 20px;
            border-top: 4px solid var(--borda-livro);
            flex-wrap: wrap;
        }

        .aba-btn {
            background: #9d174d;
            color: #fbcfe8;
            border: 3px solid #be185d;
            padding: 14px 35px;
            border-radius: 35px;
            font-size: 21px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .aba-btn.active {
            background: #ffffff;
            color: #9d174d;
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
            transform: translateY(-3px);
        }

        /* Checkbox do Checklist GIGANTE */
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 20px;
            margin-bottom: 12px;
        }
        .checklist-item input[type="checkbox"] {
            width: 30px;
            height: 30px;
            accent-color: var(--rosa-botao);
            margin: 0;
            cursor: pointer;
        }

        /* Responsividade */
        @media (max-width: 900px) {
            .livro-container { height: 94vh; }
            .livro-paginas { grid-template-columns: 1fr; gap: 30px; }
            .livro-paginas::after { display: none; }
            .livro-abas-inferior { height: auto; padding: 10px; gap: 12px; }
            .aba-btn { padding: 12px 22px; font-size: 18px; }
            h2 { font-size: 26px; }
        }
    </style>
</head>
<body>

<div class="livro-container">
    
    <!-- PÁGINAS DO LIVRO ABERTAS -->
    <div class="livro-paginas">

        <!-- ABA 1: NOVA RECEITA -->
        <div id="pagina-nova-esq" class="pagina-secao active">
            <h2>👩‍🍳 Escrever Nova Receita</h2>
            <input type="text" id="receita-titulo" placeholder="Nome do Prato (Ex: Strogonoff da Chef)">
            
            <label>Checklist de Ingredientes (Escreva um por linha):</label>
            <textarea id="receita-ingredientes" class="caderno-linhas" style="height: 250px;" placeholder="- 2 xícaras de trigo&#10;- 3 ovos&#10;- Sal a gosto..."></textarea>
            
            <button style="width: 100%; margin-top: 18px;" onclick="addReceita()">✨ Salvar Receita no Livro</button>
        </div>

        <div id="pagina-nova-dir" class="pagina-secao active">
            <h2>📖 Modo de Preparo</h2>
            <label>Passo a Passo Detalhado:</label>
            <textarea id="receita-modo" class="caderno-linhas" style="height: 400px;" placeholder="Escreva o passo a passo bem grande nas linhas..."></textarea>
        </div>

        <!-- ABA 2: MEU LIVRO DE RECEITAS SALVAS -->
        <div id="pagina-salvas-esq" class="pagina-secao">
            <h2>📜 Livro de Receitas Salvas</h2>
            <div id="container-receitas" style="max-height: 450px; overflow-y: auto; padding-right: 10px;"></div>
        </div>

        <div id="pagina-salvas-dir" class="pagina-secao">
            <h2>🌸 Anotações & Segredos da Chef</h2>
            <label>Página de Rascunho Livre:</label>
            <textarea id="anotacoes-chef" class="caderno-linhas" style="height: 400px;" placeholder="Anote dicas extras, temperatura do forno, truques..." oninput="salvarAnotacoesChef()"></textarea>
        </div>

        <!-- ABA 3: WISHLIST DA BLOGUEIRA -->
        <div id="pagina-wish-esq" class="pagina-secao">
            <h2>🛍️ Nova Wish (Lista de Desejos)</h2>
            <label>O que você quer comprar?</label>
            <input type="text" id="wish-nome" placeholder="Ex: Air Fryer Rosa / Perfume / Bolsa">

            <label>Valor aproximado (estilo banco):</label>
            <input type="text" id="wish-valor" value="R$ 0,00" oninput="formatarMoedaInput(this)">

            <label>Loja ou Observação (opcional):</label>
            <input type="text" id="wish-obs" placeholder="Ex: Shopee, Amazon, cor lilás...">

            <button style="width: 100%; margin-top: 10px;" onclick="addWish()">💖 Colocar na Wishlist</button>
        </div>

        <div id="pagina-wish-dir" class="pagina-secao">
            <h2>✨ Minha Wishlist Salva</h2>
            <div style="background: #fdf2f8; border: 2px solid #f472b6; border-radius: 12px; padding: 14px; margin-bottom: 16px; font-size: 20px; display: flex; justify-content: space-between; align-items: center;">
                <span><strong>Total da Wishlist:</strong></span>
                <strong id="wish-total" style="color: #be185d; font-size: 24px;">R$ 0,00</strong>
            </div>
            <div id="container-wish" style="max-height: 410px; overflow-y: auto; padding-right: 10px;"></div>
        </div>

    </div>

    <!-- ABAS NA PARTE INFERIOR GIGANTES -->
    <nav class="livro-abas-inferior">
        <button class="aba-btn active" onclick="trocarPagina('nova-esq', 'nova-dir', event)">✍️ Escrever Receita</button>
        <button class="aba-btn" onclick="trocarPagina('salvas-esq', 'salvas-dir', event)">📖 Meu Livro (Salvas)</button>
        <button class="aba-btn" onclick="trocarPagina('wish-esq', 'wish-dir', event)">🛍️ Wishlist</button>
    </nav>

</div>

<!-- Script de Funcionamento -->
<script>
    function trocarPagina(secaoEsquerda, secaoDireita, evt) {
        document.querySelectorAll('.pagina-secao').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.aba-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`pagina-${secaoEsquerda}`).classList.add('active');
        document.getElementById(`pagina-${secaoDireita}`).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    // --- UTILITÁRIOS DE MOEDA ESTILO BANCO (De trás pra frente) ---
    function moeda(v) {
        return Number(v || 0).toLocaleString('pt-br', { style: 'currency', currency: 'BRL' });
    }

    function extrairNumero(t) {
        let n = String(t || '').replace(/\D/g, "");
        return n ? parseFloat(n) / 100 : 0;
    }

    function formatarMoedaInput(el) {
        let v = el.value.replace(/\D/g, "");
        if (v === "") v = "0";
        el.value = moeda(parseFloat(v) / 100);
    }

    // --- RECEITAS ---
    let receitasData = JSON.parse(localStorage.getItem('central_receitas')) || [];

    function addReceita() {
        const titulo = document.getElementById('receita-titulo').value.trim();
        const ingredientes = document.getElementById('receita-ingredientes').value.trim();
        const modo = document.getElementById('receita-modo').value.trim();
        
        if (!titulo) {
            alert("Preencha o nome da receita, Chef!");
            return;
        }

        receitasData.push({ id: Date.now(), titulo, ingredientes, modo });
        
        document.getElementById('receita-titulo').value = '';
        document.getElementById('receita-ingredientes').value = '';
        document.getElementById('receita-modo').value = '';
        
        salvarReceitas();
        alert("Receita guardada no livro com sucesso! 🌸");
    }

    function salvarReceitas() {
        localStorage.setItem('central_receitas', JSON.stringify(receitasData));
        renderReceitas();
    }

    function delReceita(id) {
        if (confirm("Deseja apagar esta receita do caderno?")) {
            receitasData = receitasData.filter(r => r.id !== id);
            salvarReceitas();
        }
    }

    function habilitarEdicaoReceita(id) {
        const cardEl = document.getElementById(`receita-card-${id}`);
        const r = receitasData.find(item => item.id === id);
        if (!r || !cardEl) return;

        cardEl.innerHTML = `
            <label style="font-size: 18px; color: #be185d;">Editar Título:</label>
            <input type="text" id="edit-titulo-${id}" value="${r.titulo}" style="margin-bottom: 12px; font-size: 20px;">
            
            <label style="font-size: 18px; color: #be185d;">Editar Ingredientes (Checklist):</label>
            <textarea id="edit-ingredientes-${id}" class="caderno-linhas" style="height: 160px; margin-bottom: 12px; font-size: 20px;">${r.ingredientes}</textarea>
            
            <label style="font-size: 18px; color: #be185d;">Editar Modo de Preparo:</label>
            <textarea id="edit-modo-${id}" class="caderno-linhas" style="height: 200px; margin-bottom: 18px; font-size: 20px;">${r.modo}</textarea>
            
            <div style="display: flex; gap: 15px;">
                <button style="background: #10b981; flex: 1; font-size: 18px; padding: 16px;" onclick="salvarEdicaoReceita(${id})">💾 Salvar Alterações</button>
                <button style="background: #6b7280; flex: 1; font-size: 18px; padding: 16px;" onclick="renderReceitas()">Cancelar</button>
            </div>
        `;
    }

    function salvarEdicaoReceita(id) {
        const novoTitulo = document.getElementById(`edit-titulo-${id}`).value.trim();
        const novosIngredientes = document.getElementById(`edit-ingredientes-${id}`).value.trim();
        const novoModo = document.getElementById(`edit-modo-${id}`).value.trim();

        if (!novoTitulo) {
            alert("O nome da receita não pode ficar vazio!");
            return;
        }

        const r = receitasData.find(item => item.id === id);
        if (r) {
            r.titulo = novoTitulo;
            r.ingredientes = novosIngredientes;
            r.modo = novoModo;
            salvarReceitas();
        }
    }

    function renderReceitas() {
        const container = document.getElementById('container-receitas');
        if (!container) return;
        container.innerHTML = '';

        if (receitasData.length === 0) {
            container.innerHTML = '<p style="font-size:18px; color:#888; font-style:italic;">Nenhuma receita no livro ainda. Escreva na aba ao lado!</p>';
            return;
        }

        receitasData.forEach(r => {
            let linhasIng = r.ingredientes.split('\n').map(linha => {
                if (!linha.trim()) return '';
                return `<div class="checklist-item"><input type="checkbox"> <span>${linha.replace(/^[-*]\s*/, '')}</span></div>`;
            }).join('');

            container.innerHTML += `
                <div class="receita-card" id="receita-card-${r.id}">
                    <div style="display:flex; justify-content:space-between; margin-bottom:12px; align-items:center;">
                        <b style="color:#be185d; font-size:24px;">${r.titulo}</b>
                        <div style="display:flex; gap: 15px;">
                            <button style="background:none; color:#2563eb; padding:0; font-size:17px; box-shadow:none; font-weight:bold;" onclick="habilitarEdicaoReceita(${r.id})">✏️ Editar</button>
                            <button style="background:none; color:#ef4444; padding:0; font-size:17px; box-shadow:none; font-weight:bold;" onclick="delReceita(${r.id})">🗑️ Apagar</button>
                        </div>
                    </div>
                    <div style="font-size:19px; color:#444; margin-bottom:15px;"><strong>Ingredientes (Checklist):</strong><div style="margin-top:8px;">${linhasIng}</div></div>
                    <div style="font-size:19px; color:#333; white-space: pre-wrap; background:#fdf2f8; padding:16px; border-radius:10px;"><strong>Preparo:</strong><br>${r.modo}</div>
                </div>
            `;
        });
    }

    // Salva as anotações livres da aba Meu Livro automaticamente
    function salvarAnotacoesChef() {
        const txt = document.getElementById('anotacoes-chef');
        if (txt) localStorage.setItem('central_anotacoes_chef', txt.value);
    }

    function carregarAnotacoesChef() {
        const txt = document.getElementById('anotacoes-chef');
        if (txt) txt.value = localStorage.getItem('central_anotacoes_chef') || '';
    }

    // --- WISHLIST ---
    let wishData = JSON.parse(localStorage.getItem('central_wishlist')) || [];

    function addWish() {
        const nome = document.getElementById('wish-nome').value.trim();
        const valor = extrairNumero(document.getElementById('wish-valor').value);
        const obs = document.getElementById('wish-obs').value.trim();

        if (!nome) {
            alert("Escreve o que ela quer comprar primeiro!");
            return;
        }

        wishData.push({
            id: Date.now(),
            nome,
            valor,
            obs,
            comprado: false
        });

        document.getElementById('wish-nome').value = '';
        document.getElementById('wish-valor').value = 'R$ 0,00';
        document.getElementById('wish-obs').value = '';

        salvarWish();
    }

    function salvarWish() {
        localStorage.setItem('central_wishlist', JSON.stringify(wishData));
        renderWish();
    }

    function toggleWish(id) {
        const item = wishData.find(w => w.id === id);
        if (item) {
            item.comprado = !item.comprado;
            salvarWish();
        }
    }

    function delWish(id) {
        if (confirm("Tirar esse item da wishlist?")) {
            wishData = wishData.filter(w => w.id !== id);
            salvarWish();
        }
    }

    function habilitarEdicaoWish(id) {
        const cardEl = document.getElementById(`wish-card-${id}`);
        const w = wishData.find(item => item.id === id);
        if (!w || !cardEl) return;

        cardEl.innerHTML = `
            <label style="font-size: 18px; color: #be185d;">Item:</label>
            <input type="text" id="edit-wish-nome-${id}" value="${w.nome}" style="font-size: 20px; margin-bottom: 10px;">
            
            <label style="font-size: 18px; color: #be185d;">Valor:</label>
            <input type="text" id="edit-wish-valor-${id}" value="${moeda(w.valor)}" oninput="formatarMoedaInput(this)" style="font-size: 20px; margin-bottom: 10px;">
            
            <label style="font-size: 18px; color: #be185d;">Observação / Loja:</label>
            <input type="text" id="edit-wish-obs-${id}" value="${w.obs || ''}" style="font-size: 20px; margin-bottom: 14px;">
            
            <div style="display: flex; gap: 12px;">
                <button style="background: #10b981; flex: 1; font-size: 18px; padding: 14px;" onclick="salvarEdicaoWish(${id})">💾 Salvar</button>
                <button style="background: #6b7280; flex: 1; font-size: 18px; padding: 14px;" onclick="renderWish()">Cancelar</button>
            </div>
        `;
    }

    function salvarEdicaoWish(id) {
        const novoNome = document.getElementById(`edit-wish-nome-${id}`).value.trim();
        const novoValor = extrairNumero(document.getElementById(`edit-wish-valor-${id}`).value);
        const novaObs = document.getElementById(`edit-wish-obs-${id}`).value.trim();

        if (!novoNome) {
            alert("O nome do item não pode ficar vazio!");
            return;
        }

        const w = wishData.find(item => item.id === id);
        if (w) {
            w.nome = novoNome;
            w.valor = novoValor;
            w.obs = novaObs;
            salvarWish();
        }
    }

    function renderWish() {
        const container = document.getElementById('container-wish');
        const totalEl = document.getElementById('wish-total');
        if (!container) return;

        container.innerHTML = '';
        let somaTotal = 0;

        if (wishData.length === 0) {
            container.innerHTML = '<p style="font-size:18px; color:#888; font-style:italic;">Nenhum item na wishlist ainda. Adiciona na página ao lado!</p>';
            if (totalEl) totalEl.innerText = moeda(0);
            return;
        }

        wishData.forEach(w => {
            if (!w.comprado) somaTotal += Number(w.valor || 0);

            container.innerHTML += `
                <div class="wish-card ${w.comprado ? 'wish-comprado' : ''}" id="wish-card-${w.id}">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap: 10px; margin-bottom: 8px;">
                        <label class="checklist-item" style="margin:0; flex:1; color:#222;">
                            <input type="checkbox" ${w.comprado ? 'checked' : ''} onchange="toggleWish(${w.id})">
                            <span class="wish-nome" style="font-weight:bold; font-size:22px;">${w.nome}</span>
                        </label>
                        <strong style="color:#be185d; font-size:21px;">${moeda(w.valor)}</strong>
                    </div>
                    ${w.obs ? `<div style="font-size:18px; color:#555; margin-bottom:10px;">📌 ${w.obs}</div>` : ''}
                    <div style="display:flex; justify-content:flex-end; gap: 16px;">
                        <button style="background:none; color:#2563eb; padding:0; font-size:17px; box-shadow:none; font-weight:bold;" onclick="habilitarEdicaoWish(${w.id})">✏️ Editar</button>
                        <button style="background:none; color:#ef4444; padding:0; font-size:17px; box-shadow:none; font-weight:bold;" onclick="delWish(${w.id})">🗑️ Apagar</button>
                    </div>
                </div>
            `;
        });

        if (totalEl) totalEl.innerText = moeda(somaTotal);
    }

    carregarAnotacoesChef();
    renderReceitas();
    renderWish();
</script>
</body>
</html>
